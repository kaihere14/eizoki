<template>
  <style>
    @font-face {
      font-family: "Geist";
      src: url("assets/fonts/Geist-Regular.woff2") format("woff2");
      font-weight: 400;
    }
    @font-face {
      font-family: "Geist";
      src: url("assets/fonts/Geist-Medium.woff2") format("woff2");
      font-weight: 500;
    }
    #root {
      position: absolute;
      inset: 0;
      background: #ffffff;
      overflow: hidden;
      font-family: "Geist", sans-serif;
      color: #09090b;
    }
    .hk-line {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    .hk-word {
      position: absolute;
      top: 512px;
      font-size: 44px;
      line-height: 56px;
      font-weight: 400;
      letter-spacing: -0.01em;
      white-space: nowrap;
      opacity: 0;
    }
    #hk-l1 {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 34px;
    }
    #hk-l1 .hk-word {
      position: static;
    }
    #hk-ai {
      right: calc(1920px - 960px + 160px + 96px);
      text-align: right;
    }
    #hk-worth {
      left: calc(960px + 160px + 96px);
    }
    #hk-stage {
      position: absolute;
      left: 800px;
      top: 450px;
      width: 320px;
      height: 180px;
      perspective: 1100px;
    }
    .hk-card {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      overflow: hidden;
      background: #f4f4f5;
      box-shadow: 0 18px 40px rgba(9, 9, 11, 0.18);
      opacity: 0;
    }
    .hk-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #hk-shadow {
      position: absolute;
      left: 800px;
      top: 450px;
      width: 320px;
      height: 180px;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(9, 9, 11, 0.22);
      opacity: 0;
    }
    #hk-fill {
      position: absolute;
      inset: 0;
      overflow: hidden;
      clip-path: inset(450px 960px 450px 960px round 18px);
    }
    #hk-fill img {
      position: absolute;
      left: -80px;
      top: -200px;
      width: 2400px;
      height: 1600px;
      object-fit: cover;
    }
  </style>
  <div
    id="root"
    data-composition-id="hook"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[{"id":"line1","type":"string","label":"Opening line","default":"Still searching for"},{"id":"left","type":"string","label":"Word before card","default":"AI video"},{"id":"right","type":"string","label":"Words after card","default":"worth watching?"}]'
  >
    <div id="hk-l1" class="hk-line" data-layout-allow-overflow>
      <span class="hk-word">Still</span>
      <span class="hk-word">searching</span>
      <span class="hk-word">for</span>
    </div>

    <div id="hk-l2" class="hk-line" data-layout-allow-overflow>
      <span id="hk-ai" class="hk-word" data-var-text="left">AI video</span>
      <span id="hk-worth" class="hk-word" data-var-text="right">worth watching?</span>

      <div id="hk-shadow"></div>
      <div id="hk-stage" data-layout-allow-overflow data-layout-allow-overlap>
        <div class="hk-card hk-back"><img src="assets/posters/p10.webp" alt="" /></div>
        <div class="hk-card hk-back"><img src="assets/posters/p18.webp" alt="" /></div>
        <div class="hk-card hk-back"><img src="assets/posters/p36.webp" alt="" /></div>
        <div class="hk-card hk-back"><img src="assets/posters/p15.webp" alt="" /></div>
        <div class="hk-card hk-back"><img src="assets/posters/p23.webp" alt="" /></div>
        <div id="hk-hero" class="hk-card"><img src="assets/posters/p32.webp" alt="" /></div>
      </div>
      <div id="hk-fill" data-layout-allow-overflow>
        <img src="assets/img/window-view.jpg" alt="" />
      </div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const BLUE = "#3074fe";
      const INK = "#09090b";

      // Line 1: each word arrives out of a soft blue blur and settles to ink.
      const w1 = document.querySelectorAll("#hk-l1 .hk-word");
      w1.forEach((w, i) => {
        tl.fromTo(
          w,
          { opacity: 0, filter: "blur(16px)", color: BLUE },
          { opacity: 1, filter: "blur(0px)", color: INK, duration: 0.34, ease: "power3.out" },
          0.08 + i * 0.22,
        );
      });
      tl.to(w1, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in", stagger: 0.04 }, 1.16);

      // Line 2: hero card lands between the words.
      tl.fromTo(
        "#hk-hero",
        { opacity: 0, scale: 0.72, y: 24, filter: "blur(10px)" },
        { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "expo.out" },
        1.3,
      );
      tl.fromTo("#hk-ai", { opacity: 0, color: "#c4c4cc" }, { opacity: 1, color: INK, duration: 0.24, ease: "power2.out" }, 1.36);
      tl.fromTo("#hk-worth", { opacity: 0, color: "#c4c4cc" }, { opacity: 1, color: INK, duration: 0.24, ease: "power2.out" }, 1.46);

      // The card flips edge-on...
      tl.to("#hk-hero", { rotationY: 90, duration: 0.14, ease: "power2.in" }, 1.76);
      tl.set("#hk-hero", { opacity: 0 }, 1.9);

      // ...and opens into a fanned stack.
      const fan = [-14, -7, 7, 14, 21];
      const backs = document.querySelectorAll(".hk-back");
      backs.forEach((c, i) => {
        tl.fromTo(
          c,
          { opacity: 0, rotationY: -90, rotation: 0, transformOrigin: "50% 100%" },
          { opacity: 1, rotationY: 0, rotation: fan[i], duration: 0.36, ease: "back.out(1.4)" },
          1.9 + i * 0.035,
        );
      });
      // Front card: a window into the peak, opening from its edge.
      tl.fromTo(
        "#hk-fill",
        { clipPath: "inset(450px 960px 450px 960px round 18px)" },
        { clipPath: "inset(450px 800px 450px 800px round 18px)", duration: 0.22, ease: "power3.out" },
        1.9,
      );
      tl.fromTo("#hk-shadow", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.92);

      // Hand-off: the front card grows past the frame into the next world.
      tl.to(["#hk-ai", "#hk-worth"], { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 2.2);
      tl.to(backs, { opacity: 0, scale: 0.9, duration: 0.18, ease: "power2.in", stagger: 0.02 }, 2.22);
      tl.to("#hk-shadow", { opacity: 0, duration: 0.15 }, 2.22);
      tl.to(
        "#hk-fill",
        { clipPath: "inset(0px 0px 0px 0px round 0px)", duration: 0.36, ease: "power3.inOut" },
        2.2,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
