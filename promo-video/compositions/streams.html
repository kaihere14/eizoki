  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Seeded generator: the same streams on every render.
      let seed = 20261110;
      const rnd = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);

      // Each card flies straight through on a diagonal, in lanes either side of the words.
      function stream(cards, angleDeg, t0, spacing) {
        const a = (angleDeg * Math.PI) / 180;
        const dx = Math.cos(a), dy = Math.sin(a);
        const px = -dy, py = dx;
        cards.forEach((el, i) => {
          const side = i % 2 === 0 ? 1 : -1;
          const off = side * (165 + rnd() * 300);
          const depth = 0.62 + rnd() * 0.6; // nearer cards are bigger and faster
          const span = 1250 + 250 * depth;
          const cx = 960 + px * off, cy = 540 + py * off;
          let start = t0 + i * spacing + rnd() * 0.03;
          let dur = 1.15 - 0.3 * depth;
          let x0 = cx - dx * span - 136, y0 = cy - dy * span - 76;
          let s0 = depth * 0.8;
          if (start < 0) {
            // Already in flight when the scene opens: begin part-way along the path.
            const k = -start / dur;
            x0 += (2 * dx * span) * k; y0 += (2 * dy * span) * k; s0 += depth * 0.3 * k;
            dur += start; start = 0;
          }
          tl.fromTo(
            el,
            {
              x: x0,
              y: y0,
              scale: s0,
              rotation: (rnd() - 0.5) * 16,
              opacity: 1,
              zIndex: Math.round(depth * 10),
            },
            {
              x: cx + dx * span - 136,
              y: cy + dy * span - 76,
              scale: depth * 1.1,
              duration: dur,
              ease: "none",
            },
            start,
          );
          tl.set(el, { opacity: 0 }, start + dur);
        });
      }
      stream(Array.from(document.querySelectorAll(".st-a")), 32, -0.55, 0.05);
      stream(Array.from(document.querySelectorAll(".st-b")), -32, 0.92, 0.04);

      // Words swap on one stage.
      tl.fromTo("#st-a", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 0.12);
      tl.to("#st-a", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 0.98);
      tl.fromTo("#st-b", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 1.1);
      tl.to("#st-b", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 1.74);

      // Hand-off: one golden card flies in, then grows into the landscape.
      tl.fromTo(
        "#st-fill",
        { clipPath: "inset(1060px 0px 0px 1740px round 18px)" },
        { clipPath: "inset(450px 420px 450px 1180px round 16px)", duration: 0.3, ease: "expo.out" },
        1.62,
      );
      tl.fromTo(
        "#st-fill",
        { clipPath: "inset(450px 420px 450px 1180px round 16px)" },
        { clipPath: "inset(144px 176px 54px 176px round 24px)", duration: 0.34, ease: "power3.inOut", immediateRender: false },
        1.92,
      );

      // The streams dissolve as the golden card takes over the frame.
      tl.fromTo("#st-field", { opacity: 1 }, { opacity: 0, duration: 0.28, ease: "power1.in" }, 1.86);

      window.__timelines = window.__timelines || {};
      window.__timelines["streams"] = tl;
    })();
