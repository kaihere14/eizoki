<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #ffffff;
        --ink: #09090b;
        --brand: #3074fe;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="17.4"
      data-width="1920"
      data-height="1080"
      data-motion-blur="on"
      data-motion-blur-events="on"
      data-motion-blur-shutter="160"
    >
      <div id="ground"></div>

      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="2.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <div
        id="cabin"
        data-composition-id="cabin"
        data-composition-src="compositions/cabin.html"
        data-start="2.6"
        data-duration="2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <div
        id="orbit"
        data-composition-id="orbit"
        data-composition-src="compositions/orbit.html"
        data-start="4.6"
        data-duration="1.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <div
        id="streams"
        data-composition-id="streams"
        data-composition-src="compositions/streams.html"
        data-start="6.4"
        data-duration="2.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <div
        id="product"
        data-composition-id="product"
        data-composition-src="compositions/product.html"
        data-start="8.7"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="14.7"
        data-duration="2.7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <!-- Music bed (HeyGen catalogue). Trimmed 0.2 s in so the track's break lands on "Prompt copied" and the beat returns as the logo lands. -->
      <audio id="music" class="clip" src="assets/music/bed.mp3" data-start="0" data-duration="17.4" data-media-start="0.2" data-track-index="2" data-volume="0.6" data-fade-in="0.5" data-fade-out="1.4"></audio>
      <!-- Sound effects on the visible actions -->
      <audio id="sfx-fan" class="clip" src="assets/sfx/pop.mp3" data-start="1.9" data-duration="0.72" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-grow" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.22" data-duration="0.57" data-track-index="3" data-volume="0.3"></audio>
      <audio id="sfx-logo" class="clip" src="assets/sfx/pop.mp3" data-start="3.1" data-duration="0.72" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-push" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.26" data-duration="0.57" data-track-index="3" data-volume="0.35"></audio>
      <audio id="sfx-label" class="clip" src="assets/sfx/pop.mp3" data-start="5.1" data-duration="0.72" data-track-index="4" data-volume="0.28"></audio>
      <audio id="sfx-fling" class="clip" src="assets/sfx/whoosh.mp3" data-start="6.2" data-duration="0.57" data-track-index="3" data-volume="0.3"></audio>
      <audio id="sfx-feed" class="clip" src="assets/sfx/whoosh.mp3" data-start="8.0" data-duration="0.57" data-track-index="3" data-volume="0.3"></audio>
      <audio id="sfx-save" class="clip" src="assets/sfx/click.mp3" data-start="11.7" data-duration="0.36" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-heart" class="clip" src="assets/sfx/pop.mp3" data-start="11.73" data-duration="0.72" data-track-index="4" data-volume="0.22"></audio>
      <audio id="sfx-open" class="clip" src="assets/sfx/click.mp3" data-start="12.84" data-duration="0.36" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-copy" class="clip" src="assets/sfx/click.mp3" data-start="13.9" data-duration="0.36" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/chime.mp3" data-start="14.76" data-duration="2.5" data-track-index="6" data-volume="0.4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
